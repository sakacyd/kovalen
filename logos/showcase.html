<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kovalen â€” Logo Design Exploration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #FAFAFA;
            color: #1A1A1A;
            overflow-x: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        /* Subtle grain texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Logo hover effects */
        .logo-card {
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-card:hover {
            transform: translateY(-4px);
        }

        .logo-canvas {
            position: relative;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Aura effect on hover */
        .logo-aura {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            border-radius: 50%;
            transform: scale(0.5);
            opacity: 0;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(40px);
            pointer-events: none;
        }

        .logo-card:hover .logo-aura {
            transform: scale(1);
            opacity: 1;
        }

        /* Divider animation */
        .divider-line {
            width: 0;
            height: 1px;
            background: #1A1A1A;
            opacity: 0.2;
            transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-card:hover .divider-line {
            width: 100%;
        }

        /* Showcase image effects */
        .showcase-img {
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            border-radius: 8px;
            overflow: hidden;
        }

        .showcase-img:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        }

        /* Typography refinements */
        .tracking-ultra-wide {
            letter-spacing: 0.2em;
        }

        .text-balance {
            text-wrap: balance;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

                const LogoVariant1 = () => (
            <svg viewBox="0 0 100 100" className="w-full h-full" stroke="currentColor" fill="none">
                <path d="M 50 50 A 5 5 0 0 1 55 50 A 8 8 0 0 1 55 58 A 13 13 0 0 1 42 58 A 21 21 0 0 1 42 37 A 34 34 0 0 1 76 37" strokeWidth="2.5" strokeLinecap="round"/>
                <circle cx="50" cy="50" r="2.5" fill="currentColor" stroke="none"/>
                <circle cx="76" cy="37" r="4" fill="currentColor" stroke="none"/>
            </svg>
        );

        const LogoVariant2 = () => (
            <svg viewBox="0 0 100 100" className="w-full h-full" stroke="currentColor" fill="none">
                <path d="M 15 50 Q 30 30, 50 50 T 85 50" strokeWidth="2.5" strokeLinecap="round"/>
                <path d="M 15 50 Q 30 40, 50 50 T 85 50" strokeWidth="1.5" opacity="0.6" strokeLinecap="round" transform="translate(0, -8)"/>
                <path d="M 15 50 Q 30 44, 50 50 T 85 50" strokeWidth="1.2" opacity="0.4" strokeLinecap="round" transform="translate(0, 8)"/>
                <circle cx="15" cy="50" r="2.5" fill="currentColor" stroke="none"/>
                <circle cx="85" cy="50" r="3.5" fill="currentColor" stroke="none"/>
            </svg>
        );

        const LogoVariant3 = () => (
            <svg viewBox="0 0 100 100" className="w-full h-full" stroke="currentColor" fill="none">
                <path d="M 30 70 Q 50 70, 50 50" strokeWidth="2.5" strokeLinecap="round"/>
                <path d="M 50 50 Q 50 30, 70 30" strokeWidth="2.5" strokeLinecap="round"/>
                <path d="M 30 70 Q 25 45, 45 40" strokeWidth="1.5" strokeLinecap="round" opacity="0.5"/>
                <path d="M 45 40 Q 50 40, 50 50" strokeWidth="1.5" strokeLinecap="round" opacity="0.5"/>
                <circle cx="30" cy="70" r="4.5" fill="currentColor" stroke="none"/>
                <circle cx="50" cy="50" r="5.5" fill="currentColor" stroke="none"/>
                <circle cx="70" cy="30" r="4.5" fill="currentColor" stroke="none"/>
                <circle cx="45" cy="40" r="2.5" fill="currentColor" stroke="none" opacity="0.5"/>
            </svg>
        );

        const LogoVariant4 = () => (
            <svg viewBox="0 0 100 100" className="w-full h-full" stroke="currentColor" fill="none">
                <path d="M 30 80 Q 40 40 70 25" strokeWidth="3" strokeLinecap="round"/>
                <path d="M 25 60 Q 45 45 60 70" strokeWidth="2" strokeLinecap="round" opacity="0.6"/>
                <circle cx="70" cy="25" r="4" fill="currentColor" stroke="none"/>
                <circle cx="60" cy="70" r="3" fill="currentColor" stroke="none" opacity="0.6"/>
            </svg>
        );

        const LogoVariant5 = () => (
            <svg viewBox="0 0 100 100" className="w-full h-full" stroke="currentColor" fill="none">
                <path d="M 50 20 Q 80 50, 50 80 Q 20 50, 50 20" strokeWidth="2.5" strokeLinecap="round"/>
                <path d="M 50 40 Q 60 55, 50 70 Q 40 55, 50 40" strokeWidth="1.5" strokeLinecap="round" opacity="0.6"/>
                <circle cx="50" cy="55" r="3" fill="currentColor" stroke="none"/>
            </svg>
        );

        const LogoVariant6 = () => (
            <svg viewBox="0 0 100 100" className="w-full h-full" stroke="currentColor" fill="none">
                <path d="M 25 50 C 25 30, 45 30, 50 50 C 55 70, 75 70, 75 50 C 75 30, 55 30, 50 50 C 45 70, 25 70, 25 50" strokeWidth="2.5" strokeLinecap="round"/>
                <circle cx="50" cy="50" r="3.5" fill="currentColor" stroke="none"/>
            </svg>
        );

        const LogoShowcase = () => {
            const logos = [
                                {
                    Component: LogoVariant1,
                    title: "The Golden Spiral",
                    subtitle: "Fibonacci & Expansion",
                    philosophy: "Represents natural growth and discovery. The spiral path illustrates the academic journey from a central origin point expanding outward into broader understanding."
                },
                {
                    Component: LogoVariant2,
                    title: "Harmonic Convergence",
                    subtitle: "Radiating Pathways",
                    philosophy: "Continuous fluid motion and converging paths. The overlapping waves symbolize different academic disciplines or individuals moving in harmony and finding alignment."
                },
                {
                    Component: LogoVariant3,
                    title: "Fluid Network",
                    subtitle: "Organic Nodes",
                    philosophy: "Organic matching network. Focuses on the connections formed in academia, representing students, researchers, and institutions fluidly linking together."
                },
                {
                    Component: LogoVariant4,
                    title: "Ascending Trajectory",
                    subtitle: "Dynamic Arcs",
                    philosophy: "Trajectories of growth. The elegant, soaring arcs represent academic elevation and the serendipitous intersections of different fields of study."
                },
                {
                    Component: LogoVariant5,
                    title: "Seed of Knowledge",
                    subtitle: "Enclosed Cultivation",
                    philosophy: "The seed of knowledge. A fluid, enclosed shape that suggests cultivation of ideas and the safe environment a matchmaking platform provides for collaboration."
                },
                {
                    Component: LogoVariant6,
                    title: "Continuous Exchange",
                    subtitle: "Infinite Loop",
                    philosophy: "Continuous exchange. A stylized infinity loop representing the limitless potential of academic research and the constant flow of ideas between matched peers."
                }
            ];

            return (
                <div className="min-h-screen flex flex-col items-center py-20 px-6">

                    {/* Header */}
                    <div className="text-center mb-20 max-w-3xl">
                        <h1 className="text-6xl md:text-7xl font-extralight tracking-wider mb-6">
                            Kovalen
                        </h1>
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide mb-8">
                            Academic Matchmaking Platform
                        </p>
                        <div className="w-12 h-[1px] bg-[#1A1A1A] mx-auto opacity-30"></div>
                    </div>

                    {/* Logo Grid */}
                    <div className="max-w-7xl w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16 mb-32">
                        {logos.map((logo, index) => (
                            <div key={index} className="flex flex-col items-center logo-card cursor-pointer">

                                {/* Logo Canvas */}
                                <div className="w-64 h-64 mb-10 flex items-center justify-center relative">
                                    <div className="logo-aura"></div>
                                    <div className="w-32 h-32 relative z-10 logo-canvas">
                                        <logo.Component />
                                    </div>
                                </div>

                                {/* Text Description */}
                                <div className="text-center w-full px-4">
                                    <h2 className="text-xl font-medium tracking-wider mb-2 uppercase">
                                        {logo.title}
                                    </h2>
                                    <h3 className="text-xs font-mono opacity-50 tracking-widest mb-6">
                                        {logo.subtitle}
                                    </h3>
                                    <p className="text-sm leading-relaxed opacity-70 text-left font-light text-balance">
                                        {logo.philosophy}
                                    </p>
                                </div>

                                {/* Bottom Divider */}
                                <div className="divider-line mt-8 mx-auto"></div>
                            </div>
                        ))}
                    </div>

                    {/* Showcase Images Section */}
                    

                    {/* Footer */}
                    <div className="mt-32 max-w-2xl text-center">
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide leading-loose">
                            Generated with Logo Generator<br/>
                            2026
                        </p>
                    </div>

                </div>
            );
        };

        ReactDOM.render(<LogoShowcase />, document.getElementById('root'));
    </script>

</body>
</html>
